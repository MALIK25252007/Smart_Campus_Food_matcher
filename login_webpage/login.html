  var RAMP_HI=1280, RAMP_LO=1000, PHOTO_MIN=0.42;
  var RAMP_LO2=820, PHOTO_MIN2=0.36;

  var TP={pad:0.1076,h1Top:0.08656,h1Fs:0.06839,subTop:0.17368,subFs:0.0309,emTop:0.25435,emH:0.10257,emR:0.0202,ephFs:0.02702,ephPad:0.0332,pwTop:0.36851,pwH:0.10839,btnTop:0.50435,btnH:0.10981,btnFs:0.0275,arrow:0.026,btnGap:0.02,divTop:0.68222,orFs:0.02245,orPad:0.051,divH:0.0026,gTop:0.76445,gH:0.09966,gIcon:0.032,gtFs:0.03205,gGap:0.026,btTop:0.89668,btFs:0.02876,badgeH:0.0742,heroLh:1.1246,heroBot:0.06493,heroGap:-0.30423,heroSide:0.0525,heroFs:0.1058};

  var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
  var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

  var photoEl = document.querySelector('.photo');
  var pane    = document.querySelector('.pane');
  var card    = document.getElementById('card');
  var cardIn  = document.getElementById('cardIn');
  var hero    = document.getElementById('hero');
  var hl1     = document.getElementById('hl1');
  var root    = document.documentElement;

  function clearInline(){
    [photoEl, pane, card, cardIn, hero].forEach(function(el){ el.style.cssText=''; });
  }

  function setMode(mode){
    document.body.classList.remove('tabport','stacked');
    if(mode==='tabport') document.body.classList.add('tabport');
    if(mode==='phone') document.body.classList.add('stacked');
  }

  function lerp(a,b,t){ return a+(b-a)*t; }

  function photoRatio(vw){
    var full=1-PANE_RATIO;
    if(vw>=RAMP_HI) return full;
    if(vw<=RAMP_LO2) return PHOTO_MIN2;
    if(vw>=RAMP_LO){
      var t=(RAMP_HI-vw)/(RAMP_HI-RAMP_LO);
      return lerp(full,PHOTO_MIN,t);
    }
    var t2=(RAMP_LO-vw)/(RAMP_LO-RAMP_LO2);
    return lerp(PHOTO_MIN,PHOTO_MIN2,t2);
  }

  function placeCard(paneW, vh){
    var cs=Math.min(paneW/PANE_W, vh/CONTENT_H);
    var gapL=1*cs, mT=14*cs, mB=13*cs, mR=14*cs;
    var cw=Math.max(CARD_W*cs, paneW-gapL-mR);
    var ch=vh-mT-mB;
    card.style.left=gapL+'px';
    card.style.top=mT+'px';
    card.style.width=cw+'px';
    card.style.height=ch+'px';
    card.style.borderRadius=(26*cs)+'px';
    card.style.borderWidth=Math.max(1,cs)+'px';
    cardIn.style.width=CARD_W+'px';
    cardIn.style.height=CARD_H+'px';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
    root.style.setProperty('--cs',cs);
  }

  function seatHero(photoW, vh){
    var imgScale=Math.max(photoW/IMG_W, vh/IMG_H);
    var s=Math.min(imgScale/IMG_REF_SCALE, photoW*0.92/HERO_W);
    hero.style.transform='scale('+s+')';
  }

  function layoutLand(vw,vh){
    var pr=photoRatio(vw);
    var photoW=vw*pr;
    photoEl.style.width=photoW+'px';
    pane.style.left=photoW+'px';
    placeCard(vw-photoW, vh);
    seatHero(photoW, vh);
  }

  function kebab(s){ return s.replace(/[A-Z]/g,function(c){ return '-'+c.toLowerCase(); }); }

  function headlineMeasure(){
    var cs=getComputedStyle(hl1);
    var probe=document.createElement('span');
    probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:-9999px;'+
      'font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+';font-weight:'+cs.fontWeight+';'+
      'letter-spacing:'+cs.letterSpacing+';word-spacing:'+cs.wordSpacing+';font-variation-settings:'+cs.fontVariationSettings+';';
    probe.textContent='Find Signal to Action Instantly';
    document.body.appendChild(probe);
    var w=probe.getBoundingClientRect().width;
    document.body.removeChild(probe);
    return w;
  }

  var CARDW_KEYS=['pad','orPad'];
  var CARDH_KEYS=['h1Top','subTop','emTop','emH','pwTop','pwH','btnTop','btnH','divTop','divH','gTop','gH','btTop'];
  var BAND_KEYS=['badgeH','heroBot','heroGap','heroFs'];
  var S_KEYS=['h1Fs','subFs','emR','ephFs','ephPad','btnFs','arrow','btnGap','orFs','gIcon','gtFs','gGap','btFs'];

  function layoutTabport(vw,vh){
    var band=Math.round(vh*0.425);
    var side=Math.round(vw*TP.heroSide);
    var footer=Math.round(vh*0.0297);

    var cardW=vw-2*side;
    var cardH=vh-band-footer;
    var S=Math.min(cardH, cardW*REF_CARD_ASPECT);
    var badgeHpx=band*TP.badgeH;
    var k=badgeHpx/37;

    var set=function(name,val){ root.style.setProperty(name,val); };
    set('--band-h', band+'px');
    set('--tp-side', side+'px');
    set('--tp-footer', footer+'px');
    set('--badge-k', k);
    set('--tp-hero-lh', TP.heroLh);

    CARDW_KEYS.forEach(function(key){ set('--tp-'+kebab(key), (TP[key]*cardW)+'px'); });
    CARDH_KEYS.forEach(function(key){ set('--tp-'+kebab(key), (TP[key]*cardH)+'px'); });
    BAND_KEYS.forEach(function(key){ set('--tp-'+kebab(key), (TP[key]*band)+'px'); });
    S_KEYS.forEach(function(key){ set('--tp-'+kebab(key), (TP[key]*S)+'px'); });

    var measure=headlineMeasure();
    set('--hl-measure', Math.round(measure*0.61)+'px');
  }

  function layout(){
    var vw=window.innerWidth, vh=window.innerHeight;
    clearInline();

    if(vw<700){
      setMode('phone');
      return;
    }
    if(mqPortrait.matches){
      setMode('tabport');
      layoutTabport(vw,vh);
      return;
    }
    setMode('land');
    layoutLand(vw,vh);
  }

  window.addEventListener('resize', layout, {passive:true});
  window.addEventListener('orientationchange', layout);
  mqLandscape.addEventListener('change', layout);
  mqPortrait.addEventListener('change', layout);
  document.fonts.ready.then(layout);
  layout();
})();
</script>

<script>

(function(){
  function releaseEntrance(){
    document.documentElement.classList.remove('entry-pending');
    clearTimeout(window.__entryFallback);
  }

  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced || !(window.Element && Element.prototype.animate)){
    releaseEntrance();
    return;
  }

  var ease='cubic-bezier(.16,1,.3,1)';
  var softEase='cubic-bezier(.22,1,.36,1)';
  var compact=window.matchMedia('(max-width:699px)').matches;

  function $(id){ return document.getElementById(id); }
  var card=document.querySelector('.card');
  var badge=document.querySelector('.badge');
  var hl1=$('hl1'), hl2=$('hl2'), h1=$('h1'), sub=$('sub');
  var email=$('email'), pw=$('pw'), loginBtn=$('loginBtn');
  var divider=document.querySelector('.divider');
  var gBtn=$('gBtn'), bottom=$('bottom');

  var hlY=compact?'12px':'16px';
  var cardFrom=compact?{opacity:0,transform:'translateY(14px)'}:{opacity:0,transform:'translateY(12px) scale(.988)'};

  var steps=[
    [card,     40, 820, ease,     cardFrom],
    [badge,   120, 480, softEase, {opacity:0,transform:'translateY(8px)'}],
    [hl1,     240, 760, ease,     {opacity:0,transform:'translateY('+hlY+')',clipPath:'inset(100% 0 0 0)'}],
    [hl2,     330, 760, ease,     {opacity:0,transform:'translateY('+hlY+')',clipPath:'inset(100% 0 0 0)'}],
    [h1,      470, 620, ease,     {opacity:0,transform:'translateY(10px)'}],
    [sub,     570, 560, ease,     {opacity:0,transform:'translateY(10px)'}],
    [email,   720, 520, softEase, {opacity:0,transform:'translateY(8px)'}],
    [pw,      790, 520, softEase, {opacity:0,transform:'translateY(8px)'}],
    [loginBtn,930, 560, ease,     {opacity:0,transform:'translateY(8px)'}],
    [divider,1060, 440, softEase, {opacity:0,transform:'translateY(6px)'}],
    [gBtn,   1150, 540, ease,     {opacity:0,transform:'translateY(8px)'}],
    [bottom, 1260, 500, softEase, {opacity:0,transform:'translateY(6px)'}]
  ];

  function toState(from){
    var to={opacity:1,transform:'none'};
    if('clipPath' in from) to.clipPath='inset(0 0 0 0)';
    return to;
  }
  
  function start(){
    var animations=steps.map(function(s){
      var el=s[0], delay=s[1], duration=s[2], easing=s[3], from=s[4];
      if(!el) return null;
      return el.animate([from, toState(from)], {delay:delay,duration:duration,easing:easing,fill:'both'});
    }).filter(Boolean);

    document.documentElement.classList.remove('entry-pending');

    Promise.allSettled(animations.map(function(a){ return a.finished; })).then(function(){
      animations.forEach(function(a){ a.cancel(); });
      animations.length=0;
      releaseEntrance();
    });
  }

  Promise.race([
    document.fonts.ready,
    new Promise(function(r){ setTimeout(r,650); })
  ]).then(function(){
    requestAnimationFrame(function(){ requestAnimationFrame(start); });
  });
})();
</script>
